{{ define "main" }}
<article class="page home">
  {{ with .Params.photo }}
  {{ with resources.Get . }}
  {{ $thumb := .Resize "440x q82" }}
  <img class="home-photo" src="{{ $thumb.RelPermalink }}" width="{{ $thumb.Width }}" height="{{ $thumb.Height }}" alt="{{ $.Params.photo_alt | default $.Site.Params.author }}">
  {{ end }}
  {{ end }}
  {{ .Content }}
</article>
{{ end }}
