{{ define "main" }}
<article class="page">
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  <div class="card-grid">
    {{ range .Pages.ByWeight }}
    <a class="card" href="{{ .RelPermalink }}">
      <h2>{{ .Title }}</h2>
      {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
    </a>
    {{ end }}
  </div>
</article>
{{ end }}
