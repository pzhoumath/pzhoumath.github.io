<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Room</title><style>body{font:17px system-ui;background:#f6f7f9;color:#18232c;max-width:520px;margin:50px auto;padding:20px}button,select{font:inherit;padding:12px;border:1px solid #ccc;border-radius:12px;background:white;margin:5px}button:disabled{opacity:.4}canvas{width:100%;height:90px;background:#e8eeec;border-radius:12px}small{color:#667}#status{min-height:48px}</style><h1>Music Room</h1><p>原始音频 · 本地延迟监听 Demo</p><label>缓冲 <select id="delay"><option>1</option><option selected>3</option><option>5</option><option>10</option></select> 秒</label><p>请佩戴耳机，避免声音反馈。</p><canvas id="wave" width="500" height="90"></canvas><p id="status">准备就绪</p><button id="start">开始采集</button><button id="stop" disabled>停止</button><button id="replay" disabled>回放录音</button><p><small>本地演示，不经过网络。浏览器可能仍进行底层麦克风处理。</small></p><script>let ctx,stream,node,source,delayNode,parts=[],recording,rate;const $=id=>document.getElementById(id);const status=$('status');$('start').onclick=async()=>{try{if(ctx)await ctx.close();ctx=new AudioContext();await ctx.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});rate=ctx.sampleRate;parts=[];recording=null;const code='class Capture extends AudioWorkletProcessor{process(inputs){const x=inputs[0]?.[0];if(x)this.port.postMessage(x.slice());return true}}registerProcessor("capture",Capture)';const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));try{await ctx.audioWorklet.addModule(url)}finally{URL.revokeObjectURL(url)}source=ctx.createMediaStreamSource(stream);node=new AudioWorkletNode(ctx,'capture');const mute=ctx.createGain();mute.gain.value=0;source.connect(node).connect(mute).connect(ctx.destination);delayNode=ctx.createDelay(12);delayNode.delayTime.value=Number($('delay').value);source.connect(delayNode).connect(ctx.destination);let count=0;node.port.onmessage=e=>{parts.push(e.data);count+=e.data.length;if(count>=rate*600){$('stop').click();return}status.textContent=rate+' Hz · Float32 PCM · '+(count/rate).toFixed(1)+' 秒';const g=$('wave').getContext('2d');g.clearRect(0,0,500,90);g.strokeStyle='#27836b';g.beginPath();e.data.forEach((v,i)=>{const x=i*500/e.data.length,y=45-v*40;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()};$('start').disabled=true;$('stop').disabled=false;$('replay').disabled=true;$('delay').disabled=true}catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());status.textContent=e.message}};$('stop').onclick=()=>{stream.getTracks().forEach(t=>t.stop());node.port.onmessage=null;source.disconnect();delayNode.disconnect();const n=parts.reduce((a,b)=>a+b.length,0);if(n){recording=ctx.createBuffer(1,n,rate);let p=0;for(const x of parts){recording.copyToChannel(x,0,p);p+=x.length}}parts=[];$('start').disabled=false;$('stop').disabled=true;$('delay').disabled=false;$('replay').disabled=!recording;status.textContent='录音结束 · 可回放'};$('replay').onclick=async()=>{await ctx.resume();const s=ctx.createBufferSource();s.buffer=recording;s.connect(ctx.destination);$('replay').disabled=true;$('start').disabled=true;s.onended=()=>{$('replay').disabled=false;$('start').disabled=false};s.start()};</script></html>
