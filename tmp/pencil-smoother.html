<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f3">
<title>Pencil smoother</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    background: #fff; color: #202525; font: 15px/1.35 "Inter", system-ui, sans-serif }
  header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    padding: max(8px,env(safe-area-inset-top)) 14px 8px; border-bottom: 1px solid #dddeda;
    background: #f7f7f3 }
  h1 { margin: 0 auto 0 0; font-size: 17px; font-weight: 600; letter-spacing: -.025em }
  fieldset { display: flex; margin: 0; padding: 2px; border: 1px solid #cccfca; border-radius: 8px }
  label { position: relative; cursor: pointer }
  label span, button { display: block; padding: 8px 13px; border-radius: 5px; font: inherit }
  input { position: absolute; opacity: 0 }
  input:checked + span { background: #274642; color: white }
  input:focus-visible + span, button:focus-visible { outline: 2px solid #0366d6 }
  button { color: inherit; background: transparent; border: 1px solid #cccfca; cursor: pointer }
  main { position: relative; flex: 1; min-height: 0; touch-action: none; user-select: none;
    -webkit-user-select: none; -webkit-touch-callout: none; overflow: hidden }
  canvas, svg { position: absolute; inset: 0; width: 100%; height: 100% }
  svg { pointer-events: none }
  footer { color: #58625f; font-size: 13px; padding: 7px 14px max(7px,env(safe-area-inset-bottom));
    border-top: 1px solid #e6e7e3 }
</style>
<header>
  <h1>Pencil smoother</h1>
  <fieldset aria-label="Stroke display">
    <label><input type="radio" name="mode" value="raw"><span>Raw</span></label>
    <label><input type="radio" name="mode" value="smooth" checked><span>Smooth</span></label>
  </fieldset>
  <button id="clear" type="button">Clear</button>
</header>
<main aria-label="Drawing area">
  <canvas aria-label="Pencil strokes"></canvas>
  <svg aria-hidden="true"><path fill="none" stroke="#172321" stroke-width="1.4" stroke-linecap="round"/></svg>
</main>
<footer>Write with Pencil or mouse. Switch views to compare the same strokes.</footer>
<script type="module">
// Standalone copy of paper-lab/smoother/pencil-smoother.mjs
// Feed CSS-pixel coordinates. emit(x, y) receives each finalized vertex once.
// While writing, draw a temporary line from the last emitted point to the tip.
export class PencilSmoother {
  constructor(emit, maxShift = 0.9) {
    this.emit = emit;
    this.maxShift = Math.max(0, maxShift);
    this.pending = false;
  }

  begin(x, y) {
    this.x = x;
    this.y = y;
    this.pending = false;
    this.emit(x, y);
  }

  move(x, y) {
    const dx = x - this.x;
    const dy = y - this.y;
    if (dx === 0 && dy === 0) return;

    const length = Math.sqrt(dx * dx + dy * dy);
    if (this.pending) {
      // Average the middle point with a point on its neighbors' chord,
      // weighted by travel distance so unevenly spaced straight lines stay exact.
      const t = this.prevLength / (this.prevLength + length);
      const sx = 0.5 * (t * dx - (1 - t) * this.prevDx);
      const sy = 0.5 * (t * dy - (1 - t) * this.prevDy);
      const shift2 = sx * sx + sy * sy;
      const scale = shift2 > this.maxShift ** 2 ? this.maxShift / Math.sqrt(shift2) : 1;
      this.emit(this.x + scale * sx, this.y + scale * sy);
    }
    this.prevDx = dx;
    this.prevDy = dy;
    this.prevLength = length;
    this.x = x;
    this.y = y;
    this.pending = true;
  }

  end() {
    if (this.pending) this.emit(this.x, this.y);
    this.pending = false;
  }
}

const canvas = document.querySelector('canvas');
const tip = document.querySelector('svg path');
const ctx = canvas.getContext('2d');
const strokes = [];
let smooth = true;
let active = null;
let lastX, lastY;

function dot(x, y) {
  ctx.beginPath();
  ctx.arc(x, y, 0.7, 0, 2 * Math.PI);
  ctx.fill();
  lastX = x;
  lastY = y;
}

function line(x, y) {
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(x, y);
  ctx.stroke();
  lastX = x;
  lastY = y;
}

let starting;
const filter = new PencilSmoother((x, y) => starting ? dot(x, y) : line(x, y));

function start(x, y) {
  starting = true;
  if (smooth) filter.begin(x, y);
  else dot(x, y);
  starting = false;
}

function move(x, y) {
  if (smooth) filter.move(x, y);
  else line(x, y);
}

function showTip() {
  // Only this single segment is provisional, even on a page full of handwriting.
  tip.setAttribute('d', active && smooth && filter.pending
    ? 'M' + lastX + ' ' + lastY + 'L' + filter.x + ' ' + filter.y : '');
}

function redraw() {
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  for (const points of strokes) {
    start(points[0], points[1]);
    for (let i = 2; i < points.length; i += 2) move(points[i], points[i + 1]);
    if (smooth && points !== active?.points) filter.end();
  }
  showTip();
}

function resize() {
  const { width, height } = canvas.getBoundingClientRect();
  if (!width || !height) return;
  canvas.width = Math.round(width * devicePixelRatio);
  canvas.height = Math.round(height * devicePixelRatio);
  ctx.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
  ctx.fillStyle = ctx.strokeStyle = '#172321';
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  redraw();
}

function append(event, rect) {
  const x = event.clientX - rect.left, y = event.clientY - rect.top;
  const points = active.points;
  if (x === points[points.length - 2] && y === points[points.length - 1]) return;
  points.push(x, y);
  move(x, y);
}

canvas.onpointerdown = event => {
  if (active || event.pointerType === 'touch' || event.button !== 0) return;
  const rect = canvas.getBoundingClientRect();
  const points = [event.clientX - rect.left, event.clientY - rect.top];
  active = { id: event.pointerId, points };
  strokes.push(points);
  canvas.setPointerCapture(event.pointerId);
  start(points[0], points[1]);
};

function appendBatch(event) {
  const rect = canvas.getBoundingClientRect();
  for (const sample of event.getCoalescedEvents?.() || []) append(sample, rect);
  append(event, rect);
}

canvas.onpointermove = event => {
  if (event.pointerId !== active?.id) return;
  appendBatch(event);
  showTip();
};

function finish(event) {
  if (event.pointerId !== active?.id) return;
  if (event.type === 'pointerup') appendBatch(event);
  if (smooth) filter.end();
  active = null;
  showTip();
}
canvas.onpointerup = canvas.onpointercancel = canvas.onlostpointercapture = finish;
document.querySelector('fieldset').onchange = event => {
  smooth = event.target.value === 'smooth';
  redraw();
};
document.querySelector('#clear').onclick = () => {
  active = null;
  strokes.length = 0;
  redraw();
};
resize();
new ResizeObserver(resize).observe(canvas.parentElement);
</script>
</html>
