<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f3">
<title>Pencil smoother</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    background: #fff; color: #202525; font: 15px/1.35 "Inter", system-ui, sans-serif }
  header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    padding: max(8px,env(safe-area-inset-top)) 14px 8px; border-bottom: 1px solid #dddeda;
    background: #f7f7f3 }
  h1 { margin: 0 auto 0 0; font-size: 17px; font-weight: 600; letter-spacing: -.025em }
  fieldset { display: flex; margin: 0; padding: 2px; border: 1px solid #cccfca; border-radius: 8px }
  label { position: relative; cursor: pointer }
  label span, button { display: block; padding: 8px 13px; border-radius: 5px; font: inherit }
  input[type=radio] { position: absolute; opacity: 0 }
  input:checked + span { background: #274642; color: white }
  input:focus-visible + span, button:focus-visible { outline: 2px solid #0366d6 }
  button { color: inherit; background: transparent; border: 1px solid #cccfca; cursor: pointer }
  main { position: relative; flex: 1; min-height: 0; touch-action: none; user-select: none;
    -webkit-user-select: none; -webkit-touch-callout: none; overflow: hidden }
  .radius { display: flex; align-items: center; gap: 6px; font-size: 13px }
  .radius input { width: 85px; accent-color: #274642 }
  main canvas { position: absolute; inset: 0; width: 100%; height: 100% }
  #live { pointer-events: none }
  .reference { display: inline-flex; align-items: center; gap: 8px }
  #reference { width: 120px; height: 14px }
  footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; color: #58625f; font-size: 13px; padding: 7px 14px max(7px,env(safe-area-inset-bottom));
    border-top: 1px solid #e6e7e3 }
</style>
<header>
  <h1>Pencil smoother</h1>
  <fieldset aria-label="Stroke display">
    <label><input type="radio" name="mode" value="raw"><span>Raw</span></label>
    <label><input type="radio" name="mode" value="smooth"><span>Moving average</span></label>
    <label><input type="radio" name="mode" value="cubic" checked><span>Cubic spline</span></label>
  </fieldset>
  <label class="radius">Smoothing <input id="radius" type="range" min="1" max="7" step="0.5" value="3.5"></label>
  <button id="clear" type="button">Clear</button>
</header>
<main aria-label="Drawing area">
  <canvas aria-label="Pencil strokes"></canvas>
  <canvas id="live" aria-hidden="true"></canvas>
</main>
<footer>Switch views to compare the same handwriting.
  <span class="reference">Straight reference <canvas id="reference" aria-hidden="true"></canvas></span>
</footer>
<script type="module">
// Standalone copy of paper-lab/smoother/pencil-smoother.mjs
// Positions and radius use CSS pixels. emit(x, y) receives centerline vertices.
export class PencilSmoother {
  constructor(emit, radius = 3.5) {
    this.emit = emit;
    this.radius = Math.max(0, radius);
  }

  begin(x, y) {
    this.tipX = this.x = x;
    this.tipY = this.y = y;
    this.emit(x, y);
  }

  move(x, y) {
    const dx = x - this.tipX, dy = y - this.tipY;
    if (dx === 0 && dy === 0) return;

    // Integrate d(center)/ds = (tip - center)/radius along this straight
    // input segment. Subdividing it into more Pencil events gives the same
    // center at its end. Radius limits the trailing distance on a straight.
    const length = Math.sqrt(dx * dx + dy * dy);
    const weight = this.radius ? -Math.expm1(-length / this.radius) : 1;
    const lag = this.radius * weight / length;
    this.x += weight * (this.tipX - this.x) + (1 - lag) * dx;
    this.y += weight * (this.tipY - this.y) + (1 - lag) * dy;
    this.tipX = x;
    this.tipY = y;
    this.emit(this.x, this.y);
  }

  end() {
    if (this.x === this.tipX && this.y === this.tipY) return;
    this.x = this.tipX;
    this.y = this.tipY;
    this.emit(this.x, this.y);
  }
}

// Cubic uniform B-spline over arc-length bin averages, rendered as Béziers.
// Move the target path to the start before construction. add() extends its
// permanent prefix. drawTail() finishes a copy at the latest Pencil position.
function span(path, b, c, d) {
  path.bezierCurveTo(
    (2*b.x + c.x)/3, (2*b.y + c.y)/3,
    (b.x + 2*c.x)/3, (b.y + 2*c.y)/3,
    (b.x + 4*c.x + d.x)/6, (b.y + 4*c.y + d.y)/6
  );
}

export class CubicBezierFit {
  constructor(target, x, y, spacing = 3.5) {
    this.target = target;
    this.spacing = Math.max(0.25, spacing);
    this.b = this.c = {x, y};
    this.x = x;
    this.y = y;
    this.used = this.sumX = this.sumY = 0;
  }

  add(x, y) {
    const dx = x - this.x, dy = y - this.y;
    const length = Math.hypot(dx, dy);
    if (!length) return;

    // Integrate position along the input segment. Adding more samples on
    // the same straight segment leaves every bin average unchanged.
    let offset = 0;
    while (offset < length) {
      const room = this.spacing - this.used;
      const take = Math.min(room, length - offset);
      const mid = (offset + take / 2) / length;
      this.sumX += take * (this.x + mid * dx);
      this.sumY += take * (this.y + mid * dy);
      this.used += take;
      offset += take;
      if (take === room) {
        const next = {x: this.sumX / this.spacing, y: this.sumY / this.spacing};
        span(this.target, this.b, this.c, next);
        this.b = this.c;
        this.c = next;
        this.used = this.sumX = this.sumY = 0;
      }
    }
    this.x = x;
    this.y = y;
  }

  drawTail(path) {
    let b = this.b, c = this.c;
    if (this.used > 0) {
      const partial = {x: this.sumX / this.used, y: this.sumY / this.used};
      span(path, b, c, partial);
      b = c;
      c = partial;
    }
    const tip = {x: this.x, y: this.y};
    span(path, b, c, tip);
    span(path, c, tip, tip);
    span(path, tip, tip, tip);
  }
}

const paper = document.querySelector('canvas');
const live = document.querySelector('#live');
const radius = document.querySelector('#radius');
const base = paper.getContext('2d'), overlay = live.getContext('2d');
const strokes = [];
let active = null, mode = 'cubic', frame = 0, painted = null;

// One continuous path per stroke. Overlapping segment caps would accumulate
// antialias coverage at every input sample, visibly thickening thin lines.
class StrokePath {
  constructor(x, y) {
    this.path = new Path2D();
    this.path.moveTo(x, y);
    this.lastX = this.tipX = this.minX = this.maxX = x;
    this.lastY = this.tipY = this.minY = this.maxY = y;
    this.dot = true;
    if (mode === 'cubic') {
      this.cubic = new CubicBezierFit(this.path, x, y, Number(radius.value));
    } else if (mode === 'smooth') {
      this.filter = new PencilSmoother((cx, cy) => {
        this.path.quadraticCurveTo(this.lastX, this.lastY,
          (this.lastX + cx) / 2, (this.lastY + cy) / 2);
        this.lastX = cx;
        this.lastY = cy;
      }, Number(radius.value));
      this.filter.begin(x, y);
    }
  }

  add(x, y) {
    if (x === this.tipX && y === this.tipY) return;
    this.dot = false;
    this.tipX = x;
    this.tipY = y;
    this.minX = Math.min(this.minX, x);
    this.minY = Math.min(this.minY, y);
    this.maxX = Math.max(this.maxX, x);
    this.maxY = Math.max(this.maxY, y);
    if (this.cubic) this.cubic.add(x, y);
    else if (this.filter) this.filter.move(x, y);
    else this.path.lineTo(x, y);
  }

  paint(ctx) {
    if (this.dot) {
      ctx.beginPath();
      ctx.arc(this.tipX, this.tipY, ctx.lineWidth / 2, 0, 2 * Math.PI);
      ctx.fill();
    } else if (this.cubic) {
      const path = new Path2D(this.path);
      this.cubic.drawTail(path);
      ctx.stroke(path);
    } else if (this.filter) {
      const path = new Path2D(this.path);
      path.quadraticCurveTo(this.lastX, this.lastY,
        (this.lastX + this.tipX) / 2, (this.lastY + this.tipY) / 2);
      path.lineTo(this.tipX, this.tipY);
      ctx.stroke(path);
    } else {
      ctx.stroke(this.path);
    }
  }
}

function clearLive() {
  if (!painted) return;
  overlay.clearRect(...painted);
  painted = null;
}

function paintLive() {
  frame = 0;
  clearLive();
  if (!active) return;
  const p = active.path;
  p.paint(overlay);
  painted = [p.minX - 2, p.minY - 2, p.maxX - p.minX + 4, p.maxY - p.minY + 4];
}

function schedule() {
  if (!frame) frame = requestAnimationFrame(paintLive);
}

function redraw() {
  base.clearRect(0, 0, paper.clientWidth, paper.clientHeight);
  for (const points of strokes) {
    const p = new StrokePath(points[0], points[1]);
    for (let i = 2; i < points.length; i += 2) p.add(points[i], points[i + 1]);
    if (points === active?.points) active.path = p;
    else p.paint(base);
  }
  clearLive();
  if (active) schedule();
}

function resize() {
  const {width, height} = paper.getBoundingClientRect();
  if (!width || !height) return;
  for (const ctx of [base, overlay]) {
    const canvas = ctx.canvas;
    canvas.width = Math.round(width * devicePixelRatio);
    canvas.height = Math.round(height * devicePixelRatio);
    ctx.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
    ctx.fillStyle = ctx.strokeStyle = '#172321';
    ctx.lineWidth = 1.4;
    ctx.lineCap = ctx.lineJoin = 'round';
  }
  const reference = document.querySelector('#reference');
  const w = reference.clientWidth, h = reference.clientHeight;
  if (w && h) {
    reference.width = Math.round(w * devicePixelRatio);
    reference.height = Math.round(h * devicePixelRatio);
    const ctx = reference.getContext('2d');
    ctx.setTransform(reference.width / w, 0, 0, reference.height / h, 0, 0);
    ctx.strokeStyle = base.strokeStyle;
    ctx.lineWidth = base.lineWidth;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(2, h - 3);
    ctx.lineTo(w - 2, h - 3 - (w - 4) / 20);
    ctx.stroke();
  }
  redraw();
}

function append(event, rect) {
  const x = event.clientX - rect.left, y = event.clientY - rect.top;
  if (x === active.path.tipX && y === active.path.tipY) return;
  active.points.push(x, y);
  active.path.add(x, y);
}

function appendBatch(event) {
  const rect = paper.getBoundingClientRect();
  const samples = event.getCoalescedEvents?.();
  if (samples?.length) {
    for (const sample of samples) append(sample, rect);
  }
  if (!samples?.length || event.type === 'pointerup') append(event, rect);
}

paper.onpointerdown = event => {
  if (active || event.pointerType === 'touch' || event.button !== 0) return;
  const rect = paper.getBoundingClientRect();
  const points = [event.clientX - rect.left, event.clientY - rect.top];
  active = { id: event.pointerId, points, path: new StrokePath(...points) };
  strokes.push(points);
  paper.setPointerCapture(event.pointerId);
  schedule();
};

paper.onpointermove = event => {
  if (event.pointerId !== active?.id) return;
  appendBatch(event);
  schedule();
};

function finish(event) {
  if (event.pointerId !== active?.id) return;
  if (event.type === 'pointerup') appendBatch(event);
  clearLive();
  active.path.paint(base);
  active = null;
}
paper.onpointerup = paper.onpointercancel = paper.onlostpointercapture = finish;
document.querySelector('fieldset').onchange = event => {
  mode = event.target.value;
  radius.disabled = mode === 'raw';
  redraw();
};
radius.oninput = redraw;
document.querySelector('#clear').onclick = () => {
  active = null;
  strokes.length = 0;
  redraw();
};
resize();
new ResizeObserver(resize).observe(paper.parentElement);
</script>
</html>
